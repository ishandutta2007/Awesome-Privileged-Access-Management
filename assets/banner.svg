<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Awesome Privileged Access Management — banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="25%" stop-color="#131a3a"/>
      <stop offset="50%" stop-color="#0d2347"/>
      <stop offset="75%" stop-color="#131a3a"/>
      <stop offset="100%" stop-color="#0b1020"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="50%" stop-color="#63b3ed"/>
      <stop offset="100%" stop-color="#b794f4"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#63b3ed"/>
      <stop offset="100%" stop-color="#2b6cb0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="40" r="180" fill="#63b3ed" opacity="0.06">
    <animate attributeName="r" values="180;220;180" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="270" r="140" fill="#b794f4" opacity="0.05">
    <animate attributeName="r" values="140;170;140" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Shield with keyhole -->
  <g filter="url(#glow)">
    <path d="M 90 60 L 210 60 L 210 150 Q 210 215 150 245 Q 90 215 90 150 Z" fill="url(#shieldGrad)" stroke="#4fd1c5" stroke-width="3"/>
    <circle cx="150" cy="135" r="26" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.9"/>
    <rect x="143" y="150" width="14" height="34" rx="4" fill="#ffffff" opacity="0.9"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="3.5s" repeatCount="indefinite"/>
  </g>

  <!-- Title -->
  <text x="300" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="bold" fill="url(#titleGrad)" filter="url(#softShadow)">
    Awesome Privileged Access Management
  </text>

  <!-- Subtitle -->
  <text x="302" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#a3b8d4">
    The curated guide to securing, managing &amp; auditing privileged access
  </text>

  <!-- Pulsing status pill -->
  <g>
    <rect x="300" y="205" width="270" height="36" rx="18" fill="#ffffff" opacity="0.06" stroke="#4fd1c5" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="326" cy="223" r="6" fill="#4fd1c5">
      <animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="344" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#d8e3f5">
      16+ SaaS platforms · 20+ open-source tools · 2026 edition
    </text>
  </g>

  <!-- Small footer -->
  <text x="300" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5c7396">
    Open-source first · Just-in-time access · Secrets &amp; sessions · Zero standing privileges
  </text>
</svg>
